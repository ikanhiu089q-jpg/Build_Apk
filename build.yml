name: Flutter CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout kode dari repo
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup Java (dibutuhkan untuk Android)
      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Setup Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # 4. Install dependencies
      - name: Install dependencies
        run: flutter pub get

      # 5. (Opsional) Analisis kode
      - name: Analyze code
        run: flutter analyze

      # 6. (Opsional) Jalankan test
      - name: Run tests
        run: flutter test

      # 7. Build APK Release
      - name: Build APK
        run: flutter build apk --release

      # 8. Upload APK sebagai artifact (bisa di-download dari GitHub)
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: flutter-apk
          path: build/app/outputs/flutter-apk/app-release.apk
